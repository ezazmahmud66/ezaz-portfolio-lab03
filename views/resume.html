<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Resume Builder | Ezaz Portfolio Builder
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        rel="stylesheet"
        href="/resume-auth.css">
</head>

<body>

    <header class="dashboard-header">

        <div class="header-container">

            <a
                href="/"
                class="brand">

                Ezaz<span>.</span>

            </a>

            <button
                type="button"
                class="logout-btn"
                id="logout-btn">

                <i
                    class="fa-solid fa-right-from-bracket"
                    aria-hidden="true"></i>

                Logout

            </button>

        </div>

    </header>


    <main class="dashboard-main">

        <section class="welcome-card">

            <div class="welcome-icon">

                <i
                    class="fa-solid fa-user-shield"
                    aria-hidden="true"></i>

            </div>

            <p class="eyebrow">
                AUTHENTICATED AREA
            </p>

            <h1>
                Resume Builder
            </h1>

            <p
                class="welcome-message"
                id="welcome-message">

                Loading your account...

            </p>

            <div class="success-box">

                <i
                    class="fa-solid fa-circle-check"
                    aria-hidden="true"></i>

                <div>

                    <h2>
                        Access Granted
                    </h2>

                    <p>
                        You successfully logged in and accessed
                        a protected page using session authentication.
                    </p>

                </div>

            </div>


            <div class="next-phase">

                <i
                    class="fa-solid fa-file-lines"
                    aria-hidden="true"></i>

                <div>

                    <h2>
                        Resume Form Coming Next
                    </h2>

                    <p>
                        In Phase 06, this protected area will
                        contain the complete resume builder form.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="/resume-auth.js"></script>

</body>

</html>
